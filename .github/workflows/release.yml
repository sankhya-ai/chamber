name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-desktop:
    name: Build & Release Desktop Application
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build UI assets
        run: |
          if [ -d "ui" ] && [ -f "ui/package.json" ]; then
            npm --prefix ui ci || npm --prefix ui install
            npm --prefix ui run build || true
          fi

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./desktop/src-tauri"
          tagName: ${{ github.ref_name }}
          releaseName: "Chamber Desktop ${{ github.ref_name }}"
          releaseBody: "See release notes for changes in Chamber ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false
