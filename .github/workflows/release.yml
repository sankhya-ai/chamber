name: Release

# Builds the downloadable apps: Mac (Apple silicon) and Windows (x64 installer, on a real Windows
# runner). They are not published here: the signed, notarized Mac build is made with
# desktop/bundle.sh --release; both are uploaded to the GitHub release and R2 by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  mac:
    name: Build Chamber.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the relay's Cloudflare CLI (bundled into the app)
        run: npm --prefix relay ci
      - name: Build the app
        run: desktop/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chamber-darwin-arm64.dmg
          path: desktop/src-tauri/target/release/bundle/dmg/chamber-darwin-arm64.dmg

  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the app
        run: powershell -ExecutionPolicy Bypass -File desktop\bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: chamber-windows-x64-setup.exe
          path: desktop/src-tauri/target/release/bundle/nsis/chamber-windows-x64-setup.exe
