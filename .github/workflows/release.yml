name: Release

# Builds the downloadable Mac app (Apple silicon). The .dmg is not published here: it is uploaded
# to the R2 bucket and served by turalearn.com/chamber, like Tura's own Mac app.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  mac:
    name: Build Chamber.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the relay's Cloudflare CLI (bundled into the app)
        run: npm --prefix relay ci
      - name: Build the app
        run: desktop/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chamber-darwin-arm64.dmg
          path: desktop/src-tauri/target/release/bundle/dmg/chamber-darwin-arm64.dmg
