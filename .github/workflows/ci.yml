name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The CLI has no dependencies (and so no lockfile); only the relay does.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: relay/package-lock.json

      - name: Install relay dependencies
        working-directory: ./relay
        run: npm ci

      - name: Run the test suite
        run: npm test

  desktop-check:
    name: Desktop Build Check (Rust/Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The app ships Node beside itself; cargo check only needs a file where bundle.sh puts it.
      - name: Stand in for the bundled Node
        working-directory: ./desktop/src-tauri
        run: mkdir -p binaries && cp "$(command -v node)" "binaries/node-$(rustc -vV | sed -n 's/^host: //p')"

      - name: Check Desktop Tauri Crate
        working-directory: ./desktop/src-tauri
        run: cargo check
