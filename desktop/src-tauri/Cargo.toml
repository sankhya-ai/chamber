[package]
name = "chamber-desktop"
version = "0.2.0"
description = "Chamber Desktop — Local-first coordination network for coding agents"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
